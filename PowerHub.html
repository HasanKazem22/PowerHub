<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PowerHub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#000000;--mut:#333333;--line:#b8bfcc;--acc:#0b5cad;--accbg:#eef4fb;--ok:#0a6b2f;--bad:#b00020;--amb:#000000;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Hind Siliguri",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.lg{display:flex;gap:10px;align-items:center}.lg i{font-style:normal;width:40px;height:40px;border-radius:10px;background:var(--accbg);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.lg b{font-size:20px}.ver{font-size:11px;background:var(--accbg);color:var(--acc);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px}
.tg{display:flex;gap:4px;border:1px solid var(--line);border-radius:8px;padding:4px;align-items:center;font-size:13px;color:var(--mut)}
.tg button,.hb{border:0;background:none;color:var(--mut);padding:6px 12px;border-radius:6px;font:600 13px inherit;font-family:inherit}.tg button.on{background:var(--acc);color:#04243a}
.hb{border:1px solid var(--line);background:var(--card);color:var(--ink)}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px}
nav button{background:none;border:0;color:var(--mut);padding:12px 14px;font:600 14px inherit;font-family:inherit;white-space:nowrap;border-bottom:2px solid transparent}nav button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card,.top,.unit{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 14px}
.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}h2{margin:0 0 4px;font-size:19px}h3{margin:12px 0 6px;font-size:14px;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:13px;color:var(--mut)}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:#0b1424;color:var(--ink);font:15px inherit;font-family:inherit}
input[type=number],.nb,.nq{color:var(--acc);text-align:center}
.b{background:var(--acc);color:#04243a;border:0;border-radius:6px;padding:9px 14px;font:700 14px inherit;font-family:inherit;margin:6px 6px 0 0}.b.s{background:none;color:var(--bad);border:1px solid var(--bad)}
.uh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.num{width:34px;height:34px;border-radius:8px;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-weight:700;border:1px solid var(--line)}.uh .nm{flex:1;min-width:140px;font-weight:700;font-size:17px}.uh select{width:auto}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.st{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;color:var(--acc);font-size:13px;font-weight:700;letter-spacing:.3px}.sh a{font-weight:400;color:var(--acc);cursor:pointer;font-size:12px}
.ir{display:flex;gap:6px;align-items:center}.ir .nm{flex:1;min-width:0}.nb{width:76px}.nq{width:56px}.fx{flex:1;font-size:13px}
.x{background:none;border:0;color:var(--bad);font-size:16px;padding:4px}
.ft{margin-top:auto;border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px}.ft div{display:flex;justify-content:space-between;align-items:center;gap:8px}.ft .nq{color:var(--amb)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}.info{background:#0b1424;border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;gap:3px}.info div{display:flex;justify-content:space-between}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:14px;align-items:center}
.big{font-size:26px;font-weight:700;color:var(--acc)}.big.am{color:var(--amb)}small,.m{color:var(--mut);font-size:12px}.pill{background:var(--accbg);color:var(--acc);border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-weight:700}
.bk{background:#0b1424;border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px}.bk div{display:flex;justify-content:space-between;align-items:center;gap:8px}.bk select{width:auto;color:var(--ok)}.v{color:var(--acc);font-family:ui-monospace,monospace}
.res{background:var(--accbg);border-radius:6px;padding:8px;margin-top:8px}.res b{font-size:16px}.ok{color:var(--ok)}.bad{color:var(--bad)}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:4px 6px;text-align:left}.sc{overflow-x:auto}
.tgl{background:none;border:1px solid var(--line);color:var(--acc);border-radius:6px;width:34px;height:34px;font-size:16px}
.sug{display:inline-block;background:var(--accbg);border:1px solid var(--acc);border-radius:6px;padding:4px 10px;font-weight:700;margin:4px 0}
select.pill{width:auto;font-weight:700;color:var(--acc)}
@media print{header,nav,.noprint,button{display:none!important}}
input,select,textarea{background:#fff!important;color:#000!important;border-color:#8a93a3!important}
input[type=number],.nb,.nq{color:#000!important}
.big,.big.am,.v,.pill,select.pill,.ft .nq,.sug{color:#000!important}
.info,.bk{background:#f5f7fa!important}
.b{background:var(--acc)!important;color:#fff!important}.b.s{background:none!important;color:var(--bad)!important}
.tg button.on{color:#fff!important}.tg button{color:#222!important}
nav button{color:#222!important}nav button.on{color:var(--acc)!important}
.x{color:var(--bad)!important}.hb{color:#000!important;background:#fff!important}
body,table,td,th,li,p,small,span,label{color:#000}.m,label{color:#333!important}
.bad{color:var(--bad)!important}.ok{color:var(--ok)!important}
</style></head><body>
<header id="hdr"></header><nav id="nav"></nav><main id="app"></main>
<script>
const CB=[6,10,16,20,32,40,63,80,100,125,160,200,250,300,320,400,630,800,1000,1250,1600,2000,2500,3200,4000,5000,6300];
const CAB={6:[2.5,2.5],10:[2.5,2.5],16:[2.5,2.5],20:[4,4],32:[6,6],40:[10,10],63:[16,16],80:[25,16],100:[35,16],125:[50,25],160:[70,35],200:[95,50],250:[120,70],300:[150,70],320:[185,95],400:[240,120]};
const SOIL=[["Clay / Loam Soil (10 - 50 Ω·m)",30,"clay"],["Sandy Soil (100 - 300 Ω·m)",200,"sand"],["Rocky / Gravel Soil (300 - 1000 Ω·m)",650,"rock"]];
const FSQ={2:2.71,3:4.51,4:5.46,5:6.14,6:6.63,7:7.03,8:7.3,9:7.65,10:7.9,12:8.22,14:8.67,16:8.95,18:9.22,20:9.4};
const FLN={2:1,3:1.66,4:2.15,5:2.54,6:2.87,7:3.15,8:3.39,9:3.61,10:3.81};
const BT=[3,5,6,10,12],BW=[12,15,20,25,30,40,50,60,80,100],TR=[100,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500];
const def=()=>({bt:"res",units:[],fdbs:[],mdb:{div:1,cb:null,fac:1},bb:{I:100,t:5},sub:{pf:0.85,sp:20},e:{soil:"clay",rho:30,type:"square",L:3,d:0.0125,n:4,S:3,h:0.5,Lc:10,dc:0.01,tgt:5}});
let S=def(),tab="load";
const mig=()=>{const m=S.mdb;if(!m.fac){m.div=m.pct?(m.div>0?Math.round(10000/m.div)/100:1):(m.div>0?Math.round(100/m.div)/100:1);m.fac=1;delete m.pct}S.fdbs.forEach(b=>{if(!b.fac){b.div=b.div>0?Math.round(100/b.div)/100:1;b.fac=1}})};
try{const t=localStorage.getItem("ecalc3");if(t)S=Object.assign(def(),JSON.parse(t))}catch(e){}
mig();
let DB=null,UID=null,LT=+(localStorage.getItem("ecalc3t")||0),tm=null;
const save=()=>{LT=Date.now();try{localStorage.setItem("ecalc3",JSON.stringify(S));localStorage.setItem("ecalc3t",LT)}catch(e){}clearTimeout(tm);tm=setTimeout(()=>{if(DB)DB.doc("data/users/"+UID+"/elecalc").set({json:JSON.stringify(S),t:LT}).catch(()=>{})},1500)};
(async()=>{try{const c=window.claude;if(!c)return;const [db,us]=await Promise.all([c.use("db"),c.use("user")]);if(!db||!us)return;UID=await us.id();if(!UID)return;DB=db;const sn=await db.doc("data/users/"+UID+"/elecalc").get();if(sn.exists){const d=sn.data();if(d.t>LT){S=Object.assign(def(),JSON.parse(d.json));mig();LT=d.t;try{localStorage.setItem("ecalc3",d.json);localStorage.setItem("ecalc3t",LT)}catch(e){}draw()}}else if(S.units.length)save()}catch(e){}})();
const DV=d=>d>0?d:1;
const f=(x,d=2)=>isFinite(x)?(+x).toFixed(d):"-";
const nextCB=i=>CB.find(c=>c>=i)||CB[CB.length-1];
const typ=c=>c<=32?"MCB":c<=63?"MCB / MCCB":c<=250?"MCCB":c<=320?"MCCB / Adjustable":c==400?"MCCB / ACB":"ACB";
const MINC=6;const cabOf=cb=>{const c=CAB[cb];return c?[Math.max(c[0],MINC),Math.max(c[1],MINC)]:["Spec Sheet","Spec Sheet"]};
const get=p=>p.split(".").reduce((o,k)=>o[k],S);
function bus(cb){const a=cb/1.6;let b=null;for(const t of BT)for(const w of BW)if(t*w>=a&&(!b||t*w<b.a))b={a:t*w,t,w};return{a,b}}
const bbTxt=cb=>{const r=bus(cb);return r.b?`${r.b.w} × ${r.b.t} mm`:"Spec Sheet"};
const efdb=u=>S.bt=="com"?u.fdb:"";
function unit(u){const s1=u.lights.reduce((a,x)=>a+x.w*x.q,0)*u.ldf/100,s2=u.s13*390,s3=(u.s20*2000+u.cust.reduce((a,x)=>a+x.w*x.q,0))*u.hdf/100,W=s1+s2+s3,kw=W/1000,auto=kw>7.5?3:1,ph=u.ph=="1"?1:u.ph=="3"?3:auto,I=kw*(ph==1?5.68:1.68)*u.sf,cb=u.cb||nextCB(I);return{s1,s2,s3,W,kw,auto,ph,I,cb}}
function fdbCalc(b){const us=S.units.filter(u=>efdb(u)==b.id),kw=us.reduce((a,u)=>a+unit(u).kw,0),md=kw/DV(b.div),I=md*1.68;return{us,kw,md,I,cb:b.cb||nextCB(I)}}
function mdbCalc(){const rows=S.units.filter(u=>!efdb(u)).map(u=>{const r=unit(u);return{n:u.name,src:"Load Calculation",kw:r.kw,I:r.I}}).concat(S.fdbs.map(b=>{const r=fdbCalc(b);return{n:b.name,src:"FDB",kw:r.md,I:r.I}}));const kw=rows.reduce((a,r)=>a+r.kw,0),md=kw/DV(S.mdb.div),I=md*1.68;return{rows,kw,md,I,cb:S.mdb.cb||nextCB(I)}}
function set(p,v,num){const k=p.split(".");let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=num?(v===""?0:parseFloat(v)):v;save();draw()}
const I=(p,v,c,t)=>`<input class="${c||""}" ${t?'type="number" step="any" inputmode="decimal" ':''}value="${v}" onchange="set('${p}',this.value${t?',1':''})">`;
const N=(l,p,v)=>`<div><label>${l}${I(p,v,"",1)}</label></div>`;
const X=a=>`<button class="x" onclick="${a};save();draw()">✕</button>`;
const sw=w=>`${f(w,0)} W (${f(w/1000,2)} kW)`;
function bbBox(b,cb){const au=bus(cb),oT=get(b+"bbT"),oW=get(b+"bbW"),T=oT||(au.b?au.b.t:5),W=oW||(au.b?au.b.w:100),ok=W*T>=au.a;
return `<div><span class="m">Busbar:</span><span class="v">${au.b?au.b.w+" × "+au.b.t+" mm":"Spec Sheet"} (auto)</span></div><div class="ir"><span class="m">Width</span>${I(b+"bbW",W,"nq",1)}<span class="m">× Thick</span>${I(b+"bbT",T,"nq",1)}<span class="m">mm</span></div><div class="m ${ok?"ok":"bad"}">${f(W*T,0)} mm² ${ok?"≥":"<"} required ${f(au.a,0)} mm²</div>${oT||oW?`<a class="m" style="cursor:pointer" onclick="resetBB('${b}')">↺ back to auto size</a>`:""}`}
function resetBB(b){const o=get(b.replace(/\.$/,""));o.bbT=0;o.bbW=0;save();draw()}
function cbBox(p,over,cb,Iv,min){const c=cabOf(cb,min),u=typeof c[0]=="number"?" mm²":"";return `<div class="bk"><div><span class="m">Breaker:</span><select onchange="set('${p}',+this.value)">${CB.map(b=>`<option value="${b}" ${b==cb?"selected":""}>${b} A (${typ(b)})</option>`).join("")}</select></div>${over?`<a class="m" style="cursor:pointer" onclick="set('${p}',null)">↺ back to auto (${nextCB(Iv)} A)</a>`:""}<div><span class="m">Main Cable:</span><span class="v">${c[0]}${u}</span></div><div><span class="m">Earth Wire:</span><span class="v">${c[1]}${u}</span></div>${bbBox(p.slice(0,-2),cb)}</div>`}
function setBT(t){S.bt=t;if(t=='com'){if(!S.fdbs.length)S.fdbs.push({id:'f'+Date.now(),name:'FDB-1',div:1,fac:1,cb:null});S.units.forEach(u=>{if(!u.fdb)u.fdb=S.fdbs[0].id})}save();draw()}
function dupUnit(i){const c=JSON.parse(JSON.stringify(S.units[i]));c.name=c.name+" (copy)";c.col=false;S.units.splice(i+1,0,c);save();draw()}
function addUnit(){const U=S.bt=="com"?"Shop":"Flat";S.units.push({name:U+" "+(S.units.length+1),fdb:(S.bt=="com"&&S.fdbs.length?S.fdbs[0].id:""),ph:"auto",lights:[{n:"Light Point",w:20,q:0},{n:"Fan Point",w:75,q:0}],ldf:80,s13:0,s20:0,cust:[],hdf:70,sf:1.25,cb:null});save();draw()}
function uiLoad(){const com=S.bt=="com",U=com?"Shop":"Flat";
let h=`<div class="top"><div><h2>${com?"Commercial Shop":"Residential Flat"} Load Calculation</h2><small>3-Stage detailed calculation per unit (Lighting, 13A Sockets, Heavy 20A Power Loads)</small></div><button class="b" onclick="addUnit()">+ Add New Unit ( ${U} )</button><span>${PB("load")}<button class="hb" onclick="S.units.forEach(u=>u.col=true);save();draw()">Collapse All</button><button class="hb" onclick="S.units.forEach(u=>u.col=false);save();draw()">Expand All</button></span></div>`;
S.units.forEach((u,i)=>{const r=unit(u),p=`units.${i}.`;
if(u.col){h+=`<div class="unit"><div class="uh"><button class="tgl" onclick="set('${p}col',false)">▸</button><span class="num">${i+1}</span>${I(p+"name",u.name,"nm")}<span class="mono">${f(r.kw)} kW · ${r.ph}-Ph · ${f(r.I,1)} A · CB ${r.cb} A · BB ${bbTxt(r.cb)}</span><button class="hb" onclick="dupUnit(${i})">⧉ Duplicate</button><button class="b s" onclick="S.units.splice(${i},1);save();draw()">Remove Unit</button></div></div>`;return}
const rows=(a,k)=>a.map((x,j)=>{const q=`${p}${k}.${j}.`;return `<div class="ir">${I(q+"n",x.n,"nm")}${I(q+"w",x.w,"nb",1)}<span class="m">W ×</span>${I(q+"q",x.q,"nq",1)}${X(`S.units[${i}].${k}.splice(${j},1)`)}</div>`}).join("");
h+=`<div class="unit"><div class="uh"><button class="tgl" onclick="set('${p}col',true)">▾</button><span class="num">${i+1}</span>${I(p+"name",u.name,"nm")}${com?`<label>Connected to <select onchange="set('${p}fdb',this.value)"><option value="">MDB (direct)</option>${S.fdbs.map(b=>`<option value="${b.id}" ${u.fdb==b.id?"selected":""}>${b.name}</option>`).join("")}</select></label>`:""}<button class="hb" onclick="dupUnit(${i})">⧉ Duplicate</button><button class="b s" onclick="S.units.splice(${i},1);save();draw()">Remove Unit</button></div>
<div class="sts">
<div class="st"><div class="sh"><span>STAGE 1: LIGHTING &amp; FAN LOADS</span><a onclick="S.units[${i}].lights.push({n:'',w:0,q:1});save();draw()">+ Item</a></div>${rows(u.lights,"lights")}<div class="ft"><div>Demand Factor (%):${I(p+"ldf",u.ldf,"nq",1)}</div><div class="mono"><span>Stage 1 Subtotal:</span><b>${sw(r.s1)}</b></div></div></div>
<div class="st"><div class="sh"><span>STAGE 2: 13A CONVENIENCE SOCKETS</span></div><small>Rated 1300W with standard 30% factor = 390W per socket</small><div>Number of 13A Sockets:</div><div class="ir">${I(p+"s13",u.s13,"nb",1)}<span class="m">Sockets</span></div><div class="info mono"><div><span>Base Rating:</span><span>1,300 W</span></div><div><span>Applied Demand:</span><span>30% (Fixed)</span></div><div><span>Watt / Socket:</span><b>390 W</b></div></div><div class="ft"><div class="mono"><span>Stage 2 Subtotal:</span><b>${sw(r.s2)}</b></div></div></div>
<div class="st"><div class="sh"><span>STAGE 3: 20A POWER &amp; CUSTOM</span><a onclick="S.units[${i}].cust.push({n:'',w:0,q:1});save();draw()">+ Custom Load</a></div><div class="ir"><span class="fx">20A Heavy Sockets (2kW ea)</span>${I(p+"s20",u.s20,"nq",1)}<span class="m">Qty</span></div>${rows(u.cust,"cust")}<div class="ft"><div>Demand Factor (%):${I(p+"hdf",u.hdf,"nq",1)}</div><div class="mono"><span>Stage 3 Subtotal:</span><b>${sw(r.s3)}</b></div></div></div></div>
<div class="tot"><div><small>MAXIMUM DEMAND</small><div class="big">${f(r.kw)} kW</div><small>${f(r.W,0)} Watts</small></div>
<div><div>Detected Phase: <select class="pill" onchange="set('${p}ph',this.value)"><option value="auto" ${u.ph=="auto"?"selected":""}>Auto: ${r.auto==1?"1-Phase (230V)":"3-Phase (415V)"}</option><option value="1" ${u.ph=="1"?"selected":""}>1-Phase (230V)</option><option value="3" ${u.ph=="3"?"selected":""}>3-Phase (415V)</option></select></div><div style="margin:6px 0">Safety Factor: ${I(p+"sf",u.sf,"nq",1)}</div><small>Multipliers: 1-Phase: 5.68 | 3-Phase: 1.68</small></div>
<div><small>CALCULATED CURRENT (AMPS)</small><div class="big am">${f(r.I,1)} A</div><small>Design Current with Safety Factor</small></div>${cbBox(p+"cb",u.cb,r.cb,r.I,0)}</div></div>`});
return h||""}
function uiFdb(){if(S.bt!="com")return `<div class="card"><h2>FDB Management</h2><small>FDB is active only when Building Type is Commercial. Switch to Commercial in the header.</small></div>`;
let h=`<div class="top"><div><h2>FDB Management</h2><small>Units assigned to an FDB are listed here and feed the MDB</small></div><button class="b" onclick="S.fdbs.push({id:'f'+Date.now(),name:'FDB-'+(S.fdbs.length+1),div:1,fac:1,cb:null});save();draw()">+ Add FDB</button>${PB("fdb")}</div>`;
S.fdbs.forEach((b,i)=>{const r=fdbCalc(b),p=`fdbs.${i}.`;
if(b.col){h+=`<div class="unit"><div class="uh"><button class="tgl" onclick="set('${p}col',false)">▸</button><span class="num">${i+1}</span>${I(p+"name",b.name,"nm")}<span class="mono">${f(r.md,3)} kW · ${f(r.I,1)} A · CB ${r.cb} A · BB ${bbTxt(r.cb)}</span></div></div>`;return}
h+=`<div class="unit"><div class="uh"><button class="tgl" onclick="set('${p}col',true)">▾</button><span class="num">${i+1}</span>${I(p+"name",b.name,"nm")}<button class="b s" onclick="S.fdbs.splice(${i},1);save();draw()">Remove FDB</button></div>
<div class="sc"><table><tr><th>#</th><th>Unit</th><th>Load (kW)</th><th>Current (A)</th></tr>${r.us.map((u,j)=>{const q=unit(u);return `<tr><td>${j+1}</td><td>${u.name}</td><td>${f(q.kw,3)}</td><td>${f(q.I)}</td></tr>`}).join("")||`<tr><td colspan="4">No units assigned</td></tr>`}</table></div>
<div class="tot"><div><small>TOTAL LOAD</small><div class="big">${f(r.kw,3)} kW</div></div><div>Diversity Factor:${I(p+"div",b.div,"nq",1)}<br><small>Max Demand = Total ÷ Diversity</small></div><div><small>MAX DEMAND / CURRENT (×1.68)</small><div class="big am">${f(r.md,3)} kW · ${f(r.I,1)} A</div></div>${cbBox(p+"cb",b.cb,r.cb,r.I,6)}</div></div>`});

<p><b>ট্রান্সফরমার থেকে সরাসরি প্যানেলে নিলে:</b> প্যানেলের ইনকামার ব্রেকারই ট্রান্সফরমারের LV সুরক্ষা। ট্রান্সফরমার ও ইনকামারের মাঝের কেবল বা বাসডাক্ট ছোট রাখুন। ইনকামারের Icu (বা ফিউজের ক্ষমতা) ট্রান্সফরমার টার্মিনালের ফল্ট কারেন্টের চেয়ে বেশি হতে হবে।</p>
<p><b>CT ও রিলে সেটিং:</b> রিলের সেটিং = পিকআপ (প্রাইমারি A) × সেকেন্ডারি ÷ প্রাইমারি। যেমন ১৬৪ A-তে VCB ট্রিপ করাতে CT ১০০/৫ হলে রিলে সেটিং ১৬৪ × ৫ ÷ ১০০ = ৮.২ A (অর্থাৎ ১.৬৪ × In)। CT-র তালিকা আপনার দেওয়া মান (২০/৫, ২৫/৫, ৩০/৫ ইত্যাদি) এবং IEC 61869-2-এর প্রিফার্ড প্রাইমারি কারেন্ট মিলিয়ে নেওয়া। বাজারে প্রাপ্যতা সরবরাহকারীর কাছে যাচাই করুন।</p>
<small>৫০০ kVA পর্যন্ত LBS ও তার ওপরে VCB, এটি প্রচলিত চর্চা, ইউটিলিটি (DPDC/DESCO/PBS) যা চাইবে সেটাই চূড়ান্ত। স্ট্যান্ডার্ডের বর্ষ (যেমন 62271-103:2021, 62271-105:2021, 60898-1:2015) IEC ওয়েবস্টোরে যাচাই করা, বাকিগুলোর সর্বশেষ সংস্করণ IEC ওয়েবস্টোর থেকে দেখে নিন।</small></details>

function uiBus(){const b=S.bb,a=b.I/1.6,w=a/b.t,sug=BW.find(x=>x>=w);

function setType(t){S.e.type=t;const tb=t=="line"?FLN:FSQ;if(!tb[S.e.n])S.e.n=4;save();draw()}
function uiEarth(){const e=S.e,L=e.L,k=Math.log(4*L/e.d)-1,R=e.rho/(2*Math.PI*L)*k,tri=e.type=="tri",tb=e.type=="line"?FLN:FSQ,n=tri?3:e.n,lam=tb[e.n]||0,a=e.rho/(2*Math.PI*R*e.S);
const Rg=tri?e.rho/(2*Math.PI*L)*(1/3)*(2*(Math.log(8*L/e.d)-1)-1+2*L/e.S):R*(1+lam*a)/n;
const sc=e.sc||(e.sc={mva:10,kv:11,x:0.06,t:1,k:115,isc:0}),Rt=Rg,ok=Rt<=e.tgt,ir=sc.mva*1000/(1.73*sc.kv),msc=sc.mva/sc.x,ic=ir/sc.x,is=sc.isc>0?sc.isc:ic,Sa=is*Math.sqrt(sc.t)/sc.k;
return `<div class="top"><div><h2>Earthing Calculation</h2><small>R = single rod resistance · L = rod length (m) · d = rod diameter (m) · ρ = soil resistivity (Ω·m) · S = rod spacing (m) · λ = chart factor · n = number of electrodes</small></div>${PB("earth")}</div><div class="unit">

<div><label>ρ (Ω·m)<input type="number" step="any" value="${e.rho}" onchange="S.e.rho=+this.value||0;S.e.soil=SOIL.some(s=>s[1]==S.e.rho)?S.e.soil:'custom';save();draw()"></label></div>
<div><label>Configuration<select onchange="setType(this.value)"><option value="square" ${e.type=="square"?"selected":""}>Square</option><option value="line" ${e.type=="line"?"selected":""}>Line</option><option value="tri" ${e.type=="tri"?"selected":""}>Triangle</option></select></label></div></div>
<div class="g">${N("L (m)","e.L",e.L)}${N("d (m)","e.d",e.d)}${N("S (m)","e.S",e.S)}${tri?"":`<div><label>n<select onchange="set('e.n',+this.value)">${Object.keys(tb).map(x=>`<option ${x==e.n?"selected":""}>${x}</option>`).join("")}</select></label></div>`}</div>
<div class="g"><div><label>Target Resistance<select onchange="set('e.tgt',+this.value)"><option value="1" ${e.tgt==1?"selected":""}>1 Ω (Data Center / Substation)</option><option value="5" ${e.tgt==5?"selected":""}>5 Ω (General / Residential)</option></select></label></div></div>
<div class="res">Single rod R = <b>${f(R)} Ω</b>${tri?"":` · λ = ${lam} · a = ${f(a,3)}`}<br>${tri?"R<sub>e</sub>":"R<sub>n</sub>"} = <b>${f(Rg)} Ω</b><br>R<sub>total</sub> = <b>${f(Rt)} Ω</b> (target ≤ ${e.tgt} Ω)<br><b class="${ok?"ok":"bad"}">${ok?"ACCEPTED":"NOT ACCEPTED / ADD MORE RODS"}</b></div></div>
<div class="unit"><h2>Cross Sectional Area of Bare Copper Conductor</h2><div class="g">${N("MVA base","e.sc.mva",sc.mva)}${N("KV base","e.sc.kv",sc.kv)}${N("X (pu)","e.sc.x",sc.x)}${N("I sc (A), 0 = calculate","e.sc.isc",sc.isc)}${N("t, disconnection time (s)","e.sc.t",sc.t)}${N("k","e.sc.k",sc.k)}</div>
<div class="res">MVA<sub>sc</sub> = MVA<sub>base</sub> / X<sub>pu</sub> = <b>${f(msc)} MVA</b><br>I<sub>rated</sub> = MVA<sub>base</sub> × 1000 / (1.73 × KV<sub>base</sub>) = <b>${f(ir,1)} A</b><br>I<sub>sc</sub> = I<sub>rated</sub> / X<sub>pu</sub> = <b>${f(ic,1)} A</b>${sc.isc>0?` (entered I<sub>sc</sub> = ${f(is,1)} A is used)`:""}<br>S = I<sub>sc</sub> × √t / k = <b>${f(Sa,1)} mm²</b></div></div>`}

<details open class="card noprint"><summary><b>ধরন বুঝে নিন (শুধু স্ক্রিনে)</b></summary><ol><li><b>On-grid:</b> গ্রিডের সঙ্গে যুক্ত, ব্যাটারি নেই। দিনে নিজের লোড চালায়, গ্রিড বন্ধ থাকলে ইনভার্টারও বন্ধ হয়।</li><li><b>Off-grid:</b> গ্রিড নেই। ব্যাটারি ও চার্জ কন্ট্রোলার লাগে, ইনভার্টার পিক লোড ও সার্জ ধরে নির্বাচন হয়।</li><li><b>Hybrid:</b> গ্রিড, সোলার ও ব্যাটারি একসঙ্গে। বিদ্যুৎ গেলে গুরুত্বপূর্ণ লোডে ব্যাকআপ দেয়।</li><li><b>Net metering:</b> বাড়তি বিদ্যুৎ গ্রিডে পাঠায়, দ্বিমুখী মিটার লাগে। ক্যাপাসিটি সীমা ও ইউটিলিটির অনুমোদন লাগে।</li></ol><small>ক্যাবলের মান IEC 62548-1 অনুযায়ী ১.২৫ × Isc। স্ট্রিং ভোল্টেজ সবচেয়ে ঠান্ডা তাপমাত্রায় (Voc বাড়ে) ও সবচেয়ে গরমে (Vmp কমে) দুটোই মিলিয়ে দেখা হয়।</small></details>`}

const TOOLS="ডিজিটাল মাল্টিমিটার (CAT III বা IV), ক্ল্যাম্প মিটার, মেগার (৫০০ V, ১ kV, ৫ kV), ভোল্টেজ ডিটেক্টর, ফেজ সিকোয়েন্স মিটার, থার্মাল ইমেজার, আর্থ টেস্টার, লুপ ইম্পিড্যান্স ও RCD টেস্টার, মাইক্রো-ওহমমিটার, পাওয়ার ও হারমোনিক অ্যানালাইজার, ভাইব্রেশন মিটার, টর্ক রেঞ্চ।";
function faultBody(sel,q){const k=(q||"").trim();let h="";FT.filter(e=>!sel||sel=="all"||e.k==sel).forEach(e=>{const it=e.f.filter(x=>!k||x.join(" ").includes(k));if(!it.length)return;h+=`<h2>${e.n}</h2>`+it.map(x=>`<table><tr><th colspan="2">${x[0]}</th></tr><tr><td width="22%"><b>লক্ষণ</b></td><td>${x[1]}</td></tr><tr><td><b>চিহ্নিতকরণ</b></td><td>${x[2]}</td></tr><tr><td><b>সম্ভাব্য কারণ</b></td><td>${x[3]}</td></tr><tr><td><b>সমাধান</b></td><td>${x[4]}</td></tr></table><br>`).join("")});return h||"<p>কিছু পাওয়া যায়নি।</p>"}
function docHTML(t){const body=`<h2>নিরাপত্তার ৫ নিয়ম</h2><ol>${SAFE.map(x=>`<li>${x}</li>`).join("")}</ol><h2>জরুরি কাজে ধাপ</h2><ol>${EMG.map(x=>`<li>${x}</li>`).join("")}</ol>`+faultBody("all","");
return `<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><title>PowerHub</title><style>body{font-family:system-ui,"Noto Sans Bengali","Hind Siliguri",sans-serif;color:#000;background:#fff;max-width:820px;margin:20px auto;line-height:1.5;padding:0 12px}h1{font-size:22px;margin:0}h2{font-size:17px;border-bottom:1px solid #000;margin-top:18px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #444;padding:4px 6px;vertical-align:top;font-size:13px;text-align:left}details{margin:8px 0}</style></head><body><h1>PowerHub</h1><p>Enterprise of “NIKHOJ STUDIO” - ত্রুটি চিহ্নিতকরণ ও সমাধান</p>${body}</body></html>`}
function repHTML(t){const L=rep(t);return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>PowerHub</title><style>body{font-family:monospace;color:#000;background:#fff;max-width:900px;margin:20px auto;padding:0 12px;font-size:13px}div{white-space:pre-wrap}b{display:block;margin-top:10px}</style></head><body><h2>PowerHub</h2><p>Enterprise of “NIKHOJ STUDIO” - ${TABS.find(x=>x[0]==t)[1]} - ${new Date().toLocaleDateString("en-GB")}</p>${L.map(l=>l[0]=="#"?`<b>${l.slice(1).replace(/</g,"&lt;")}</b>`:`<div>${l.replace(/</g,"&lt;")}</div>`).join("")}</body></html>`}
async function getDL(){try{return await window.claude.use("downloads")}catch(e){return null}}
async function saveHTML(dl,name,html){await dl.save({filename:name,data:html})}
async function dlDoc(t,b){const o=b.textContent,dn=m=>{b.textContent=m;setTimeout(()=>{b.textContent=o},3500)},dl=await getDL();if(!dl){dn("Download not available here, use Print");return}
try{await saveHTML(dl,"PowerHub-"+t+"-report.html",docHTML(t));dn("Saved ✔ (open, then Print to PDF)")}catch(e){dn(e&&e.code=="declined"?o:"Error: "+((e&&e.code)||"failed"))}}
function printPage(){try{window.print()}catch(e){}}
async function pdf(t,b){const o=b.textContent,dn=m=>{b.textContent=m;setTimeout(()=>{b.textContent=o},3500)},dl=await getDL();if(!dl){dn("Download not available here, use Print");return}
try{const J=window.jspdf;if(!J)throw{code:"nolib"};
const d=new J.jsPDF({unit:"mm",format:"a4"});let y=18;d.setFont("helvetica","bold");d.setFontSize(18);d.text("PowerHub",14,y);y+=6;d.setFont("helvetica","normal");d.setFontSize(10);d.text('Enterprise of "NIKHOJ STUDIO"',14,y);y+=6;
d.text(A(TABS.find(x=>x[0]==t)[1])+" Report - "+new Date().toLocaleDateString("en-GB")+" - "+(S.bt=="com"?"Commercial":"Residential")+" - For "+(PF=="customer"?"Customer":"Designer"),14,y);y+=3;d.line(14,y,196,y);y+=6;d.setFontSize(8.5);
const L=rep(t);if(!L.length)L.push("No data entered yet.");
L.forEach(l=>{const h=l[0]=="#";d.setFont("courier",h?"bold":"normal");d.splitTextToSize(A(h?l.slice(1):l),182).forEach(w=>{if(y>284){d.addPage();y=16}d.text(w,14,y);y+=4.2})});
await dl.save({filename:"PowerHub-"+t+"-report.pdf",data:d.output("arraybuffer")});dn("Saved ✔")}
catch(e){if(e&&e.code=="declined"){dn(o);return}
try{await saveHTML(dl,"PowerHub-"+t+"-report.html",repHTML(t));dn("PDF not possible, saved as HTML (open, then Print to PDF)")}catch(e2){dn("Error: "+((e2&&e2.code)||"failed"))}}}
const PB2=t=>`<span style="display:inline-flex;gap:6px;flex-wrap:wrap"><button class="b" style="margin:0" onclick="dlDoc('${t}',this)">⬇ Download</button><button class="hb" onclick="printPage()">🖨 Print</button></span>`;
function uiFault(){const sel=S.fe||"all",q=S.fq||"";return `<div class="top"><div><h2>ত্রুটি চিহ্নিতকরণ ও সমাধান</h2><small>ইন্ডাস্ট্রির সাধারণ ইলেকট্রিক্যাল যন্ত্রের ত্রুটি, চিহ্নিত করার পদ্ধতি ও সমাধান</small></div>${PB2("fault")}</div>
<div class="card" style="border-left-color:var(--bad)"><h2 class="bad">আগে নিরাপত্তা: ৫ নিয়ম (সবসময়)</h2><ol>${SAFE.map(x=>`<li>${x}</li>`).join("")}</ol></div>
<details class="card" open><summary><b>জরুরি কাজ হঠাৎ সামনে এলে: ধাপে ধাপে</b></summary><ol>${EMG.map(x=>`<li>${x}</li>`).join("")}</ol><p><b>দরকারি যন্ত্র:</b> ${TOOLS}</p></details>
<div class="unit"><div class="g"><div><label>যন্ত্র বেছে নিন<select onchange="set('fe',this.value)"><option value="all" ${sel=="all"?"selected":""}>সব যন্ত্র</option>${FT.map(e=>`<option value="${e.k}" ${sel==e.k?"selected":""}>${e.n}</option>`).join("")}</select></label></div><div><label>খুঁজুন (বাংলা শব্দ)<input value="${q}" onchange="set('fq',this.value)"></label></div></div></div>
<div class="faults">${faultBody(sel,q)}</div><small>এই তথ্য সাধারণ ইঞ্জিনিয়ারিং চর্চা অনুযায়ী। প্রস্তুতকারকের ম্যানুয়াল ও আপনার সাইটের নিরাপত্তা বিধি সবসময় আগে।</small>`}
const TABS=[["load","Load Calculation"],["fdb","FDB Management"],["mdb","MDB Master Panel"],["sub","Substation Sizing"],["pf","Power Factor"],["earth","Earthing Calc"],["bus","Busbar Sizing"],["solar","Solar System"],["motor","Motor Selection"],["rewind","Motor Rewinding"],["fault","Fault Finding"]];
function exp(){const t=JSON.stringify(S,null,1),b=document.getElementById("ex");try{navigator.clipboard.writeText(t).then(()=>{b.textContent="Copied ✔"})}catch(e){prompt("Copy:",t)}}
function draw(){document.getElementById("hdr").innerHTML=`<div class="lg"><i>⚡</i><div><b>PowerHub</b><span class="ver">v2.5 BNBC/IEC</span><br><small>Enterprise of “NIKHOJ STUDIO”</small></div></div><div class="tg">Building Type: <button class="${S.bt=="res"?"on":""}" onclick="S.bt='res';save();draw()">Residential</button><button class="${S.bt=="com"?"on":""}" onclick="setBT('com')">Commercial</button></div><button class="hb" id="ex" onclick="exp()">Export JSON</button>`;
document.getElementById("nav").innerHTML=TABS.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';draw();scrollTo(0,0)">${t[1]}</button>`).join("");
document.getElementById("app").innerHTML={load:uiLoad,fdb:uiFdb,mdb:uiMdb,sub:uiSub,pf:uiPF,solar:uiSolar,earth:uiEarth,bus:uiBus,motor:uiMotor,rewind:uiRewind,fault:uiFault}[tab]()}
draw();
</script></body></html>
